//CROSSHAIR
// CS2 dropped cl_crosshaircolor, cl_crosshairgap, cl_crosshairgap_useweaponvalue,
// cl_crosshair_outlinethickness, cl_crosshairusealpha and cl_fixedcrosshairgap.
// Set those in Settings > Crosshair, or paste a share code.
cl_crosshair_drawoutline "1"
cl_crosshair_dynamic_maxdist_splitratio "0.35"
cl_crosshair_dynamic_splitalpha_innermod "1"
cl_crosshair_dynamic_splitalpha_outermod "0.5"
cl_crosshair_dynamic_splitdist "7"
cl_crosshair_sniper_width "2"
cl_crosshairalpha "255"
cl_crosshaircolor_b "255"
cl_crosshaircolor_g "0"
cl_crosshaircolor_r "255"
cl_crosshairdot "0"
cl_crosshairsize "1.5"
cl_crosshairstyle "4"
cl_crosshairthickness "0.500000"

//SENSITIVITY
zoom_sensitivity_ratio "0.818933027098955175"
sensitivity "1.34"

//KEYBOARD BINDS
// clear first, then bind - otherwise a later unbind kills an earlier bind
unbind "f6"
unbind "f7"
unbind "f8"
unbind "f9"
unbind "f10"
unbind "f11"
unbind "f12"
unbind "8"
unbind "9"
unbind "0"
unbind "-"
unbind "="
unbind "q"
unbind "i"
unbind "o"
unbind "p"
unbind "["
unbind "]"
unbind "\"
unbind "h"
unbind "j"
unbind "k"
unbind "l"
unbind "n"
unbind "/"
unbind "INS"
unbind "HOME"
unbind "PGUP"
unbind "END"

bind "ctrl" "+duck;"
bind "shift" "+sprint;"
bind space "+jump"
bind "w" "+forward;"
bind "a" "+left;"
bind "s" "+back;"
bind "d" "+right;"
bind "c" "+runthrow;"
bind "v" "-attack"
bind "mouse1" "+attack"
bind "mouse2" "+attack2"
bind "mwheelup" "slot7"
bind "mwheeldown" "+jump"
bind "f" "slot8"
bind "mouse4" "slot10"
bind "mouse5" "+voicerecord"
bind "alt" "player_ping"
bind "f1" "buy awp"
bind "f2" "buy ak47; buy m4a1_silencer"
bind "f3" "buy vesthelm; buy vest"
bind "f4" "buy smokegrenade; buy flashbang; buy flashbang; buy hegrenade"
bind "f5" "buy smokegrenade; buy flashbang; buy flashbang; buy molotov; buy incgrenade"
bind "PGDN" "r_fullscreen_gamma 1.99"
bind "PGUP" "r_fullscreen_gamma 2"
bind "rightarrow" "noclip"
bind "leftarrow" "sv_rethrow_last_grenade"
bind "downarrow" "volume 0"
bind "uparrow" "volume 1"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot6"
bind "5" "slot5"
bind "6" "slot9"
bind "e" "+use"
bind "r" "+reload"
bind "t" "+lookatweapon"
bind "y" "messagemode"
bind "u" "messagemode2"
bind "g" "drop"
bind "z" "radio"
bind "x" "+spray_menu"
bind "b" "buymenu"
bind "m" "teammenu"
bind "," "buyammo1"
bind "." "buyammo2"
bind "TAB" "+showscores"
bind "DEL" "sellbackall"

//SOUND
snd_headphone_eq "1"   // Crisp: lifts the highs where footsteps live
snd_steamaudio_enable_perspective_correction "1"
snd_tensecondwarning_volume "0.2"
snd_menumusic_volume "0"
snd_mapobjective_volume "0"
snd_deathcamera_volume "0"
snd_mvp_volume "0.1"
snd_roundaction_volume "0"
snd_roundend_volume "0"
snd_roundstart_volume "0"
volume 1

//MISC
rate "786432"
cl_autohelp "0"
fps_max "0"
cl_teamid_overhead_mode "2"
cl_radar_scale "0.6"
cl_showloadout "0"
cl_use_opens_buy_menu "0"
cl_hide_avatar_images "0"
cl_silencer_mode "0"
viewmodel_presetpos "1"
// HUD pulled in from the screen edges (0.85 is as far in as CS2 allows)
safezonex "0.85"
// safezoney "0.85"   // uncomment to try the vertical equivalent
hud_showtargetid "1"
r_fullscreen_gamma "2.1"