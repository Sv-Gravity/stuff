// =====================================================
//  PRACTICE CONFIG
//  Put this in  ...\Counter-Strike Global Offensive\game\csgo\cfg\
//  Start an offline game with bots, then in console:  exec prac.cfg
// =====================================================

sv_cheats 1

// ---------- server / round ----------
bot_kick
mp_limitteams 0
mp_autoteambalance 0
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_ignore_round_win_conditions 1      // round never ends on its own
sv_full_alltalk 1
mp_warmup_end

// ---------- money, buy anywhere, any time ----------
mp_maxmoney 65535
mp_startmoney 65535
mp_afterroundmoney 65535
mp_buytime 60000
mp_buy_anywhere 1

// ---------- die less, and keep your kit when you do ----------
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_respawn_immunitytime 0
sv_regeneration_force_on 1            // heals you back up
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_defuser 0
mp_free_armor 2                       // armor + helmet, free
// god mode will not stick from a cfg - press F7 in game (see binds below)

// ---------- grenades ----------
sv_infinite_ammo 1                    // nades are never used up
ammo_grenade_limit_total 6
ammo_grenade_limit_default 1
ammo_grenade_limit_flashbang 2

// ---------- trajectories and impacts ----------
sv_grenade_trajectory_prac_trailtime 8      // 8 is the maximum
sv_grenade_trajectory_time_spectator 8
sv_grenade_trajectory_prac_pipreview 1      // F12 toggles this off
sv_showimpacts 1
sv_showimpacts_time 10

// ---------- movement practice (uncomment if you want it) ----------
// sv_enablebunnyhopping 1
// sv_autobunnyhopping 1
// sv_staminajumpcost 0
// sv_staminalandcost 0

// ---------- practice binds ----------
// These sit on F6-F12, which your autoexec leaves empty.
// Re-exec your autoexec to clear them.
bind "F6" "give weapon_smokegrenade; give weapon_flashbang; give weapon_hegrenade; give weapon_molotov; give weapon_incgrenade; give weapon_decoy"
bind "F7" "god"
bind "F8" "noclip"
bind "F9" "sv_rethrow_last_grenade"
bind "F10" "mp_restartgame 1"
bind "F11" "ent_fire smokegrenade_projectile kill; ent_fire flashbang_projectile kill; ent_fire hegrenade_projectile kill; ent_fire molotov_projectile kill; ent_fire decoy_projectile kill; ent_fire inferno kill"
bind "F12" "toggle sv_grenade_trajectory_prac_pipreview 0 1"

mp_restartgame 1

echo "======================================"
echo " Prac settings loaded"
echo " F6  all grenades      F7  god mode"
echo " F8  noclip            F9  rethrow last nade"
echo " F10 restart round     F11 clear nades/fire"
echo " F12 nade preview on/off"
echo "======================================"
